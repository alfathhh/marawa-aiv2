<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARAWA · Panel Petugas PST</title>
<style>
/* ─────────────────────────────────────────────────────────────
   MARAWA — panel petugas PST, BPS Kabupaten Padang Pariaman

   Tugas tunggal halaman ini: memberi tahu siapa yang sedang
   menunggu manusia, dan berapa lama. Semua keputusan visual
   turun dari sana.

   Warna hanya dipakai untuk MENGKODE STATE. Sisanya netral,
   supaya satu-satunya hal berwarna panas di layar adalah orang
   yang sedang menunggu.
   ───────────────────────────────────────────────────────────── */
:root {
  --paper:    #EEF1F4;
  --surface:  #FFFFFF;
  --ink:      #0F1419;
  --muted:    #5B6572;
  --rule:     #D5DBE2;

  --waiting:  #B23C10;
  --waiting-wash: #FDF0EA;
  --human:    #1B4ACC;
  --human-wash:   #EDF1FE;
  --bot:      #05704F;
  --closed:   #8A96A4;

  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --cond: 'Barlow Condensed', 'Arial Narrow', var(--sans);

  --r: 6px;
  --shadow: 0 1px 2px rgba(15,20,25,.06), 0 4px 12px rgba(15,20,25,.04);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--human); outline-offset: 2px; border-radius: 3px; }

/* Eyebrow: label struktural yang membawa informasi nyata (jumlah),
   bukan hiasan. */
.eyebrow {
  font-family: var(--cond); font-weight: 600; font-size: 13px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
}
.eyebrow .count {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  background: var(--ink); color: #fff; padding: 1px 7px; border-radius: 999px;
  letter-spacing: 0;
}
.eyebrow.is-waiting { color: var(--waiting); }
.eyebrow.is-waiting .count { background: var(--waiting); }
.eyebrow hr { flex: 1; border: 0; border-top: 1px solid var(--rule); }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 56px; background: var(--surface);
  border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 40;
}
.brand { font-family: var(--cond); font-weight: 700; font-size: 21px; letter-spacing: .04em; }
.brand span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 15px; letter-spacing: .06em; }
.spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--closed); flex: none; }
.dot.ok { background: var(--bot); }
.dot.bad { background: var(--waiting); }
.who { font-size: 13px; color: var(--muted); }
.who b { color: var(--ink); font-weight: 600; }

.shell { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; height: calc(100% - 56px); }
.queue { overflow-y: auto; padding: 20px; border-right: 1px solid var(--rule); }
.thread { overflow-y: auto; padding: 24px 28px; background: var(--surface); }
.group + .group { margin-top: 26px; }

/* SIGNATURE — kartu menunggu.
   Satu-satunya elemen besar dan panas di layar. Pita kiri MENEBAL
   seiring lama menunggu, jadi urgensi terbaca dari seberang meja
   tanpa perlu membaca angkanya. Ketebalan dipakai, bukan hanya
   warna, supaya tetap terbaca bagi yang sulit membedakan warna. */
.wait-card {
  position: relative; background: var(--surface); border: 1px solid var(--rule);
  border-left: 5px solid var(--waiting); border-radius: var(--r);
  padding: 14px 16px 14px 18px; margin-bottom: 10px; cursor: pointer;
  box-shadow: var(--shadow); text-align: left; width: 100%; display: block;
  transition: transform .12s ease, box-shadow .12s ease;
}
.wait-card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(15,20,25,.08), 0 8px 20px rgba(15,20,25,.07); }
.wait-card[data-urgency="2"] { border-left-width: 8px; background: var(--waiting-wash); }
.wait-card[data-urgency="3"] { border-left-width: 12px; background: var(--waiting-wash); }
.wait-card[data-urgency="3"]::after {
  content: ''; position: absolute; inset: -1px -1px -1px -12px;
  border-radius: var(--r); border: 1px solid var(--waiting); opacity: .3;
  animation: breathe 2.6s ease-in-out infinite; pointer-events: none;
}
@keyframes breathe { 0%,100% { opacity: .12; } 50% { opacity: .5; } }

.wait-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.contact { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.timer {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 26px; font-weight: 600; line-height: 1; color: var(--waiting); letter-spacing: -.02em;
}
.timer small { font-size: 11px; font-weight: 500; letter-spacing: .08em; opacity: .7; margin-left: 3px; }
.preview {
  margin-top: 8px; color: var(--muted); font-size: 14px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 12px; background: none; border: 0; border-radius: var(--r); cursor: pointer; color: inherit;
}
.row:hover { background: rgba(15,20,25,.045); }
.row.active { background: var(--human-wash); box-shadow: inset 0 0 0 1px rgba(27,74,204,.25); }
.row .tick { width: 3px; align-self: stretch; border-radius: 2px; background: var(--closed); flex: none; }
.row.s-ADMIN_ACTIVE .tick { background: var(--human); }
.row.s-BOT_ACTIVE   .tick { background: var(--bot); }
.row .id { font-family: var(--mono); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .by { font-size: 12px; color: var(--muted); }

.empty {
  border: 1px dashed var(--rule); border-radius: var(--r);
  padding: 18px; color: var(--muted); font-size: 14px; background: rgba(255,255,255,.5);
}
.empty b { color: var(--ink); font-weight: 600; }

.thread-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.thread-head h2 { font-family: var(--mono); font-size: 16px; font-weight: 600; margin: 0; }
.pill {
  font-family: var(--cond); font-size: 12px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 999px; color: #fff;
}
.pill.BOT_ACTIVE { background: var(--bot); }
.pill.QUEUED { background: var(--waiting); }
.pill.ADMIN_ACTIVE { background: var(--human); }
.pill.IDLE_CLOSED { background: var(--closed); }

.btn {
  padding: 8px 15px; border-radius: var(--r); border: 1px solid var(--ink);
  background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; font-weight: 500;
}
.btn:hover { opacity: .88; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); opacity: 1; }
.btn.take { background: var(--waiting); border-color: var(--waiting); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.msgs { padding: 20px 0; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 74%; padding: 10px 13px; border-radius: 12px; font-size: 14.5px; }
.bubble .meta {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
  text-transform: uppercase; opacity: .65; margin-bottom: 4px;
}
.bubble.in  { align-self: flex-start; background: var(--paper); border-bottom-left-radius: 3px; }
.bubble.out { align-self: flex-end; background: var(--human); color: #fff; border-bottom-right-radius: 3px; }
.bubble.out.by-bot { background: var(--bot); }
.body-text { white-space: pre-wrap; word-break: break-word; }

.composer { border-top: 1px solid var(--rule); padding-top: 14px; }
.composer textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 11px 13px;
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface);
}
.composer textarea:disabled { background: var(--paper); }
.composer-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.hint { font-size: 13px; color: var(--muted); flex: 1; }

.login-wrap { display: grid; place-items: center; min-height: calc(100% - 56px); padding: 24px; }
.login {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 10px; padding: 30px 28px; box-shadow: var(--shadow);
}
.login h1 { font-family: var(--cond); font-size: 27px; margin: 0 0 4px; letter-spacing: .02em; }
.login p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-family: var(--cond); font-size: 12px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
}
.field input { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.field input#totp { font-family: var(--mono); font-size: 19px; letter-spacing: .3em; text-align: center; }
.alert {
  margin-top: 14px; padding: 10px 12px; border-radius: var(--r); font-size: 13.5px;
  background: var(--waiting-wash); color: var(--waiting); border: 1px solid rgba(178,60,16,.25);
}

#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.tabs { display: flex; gap: 2px; }
.tab {
  font-family: var(--cond); font-size: 14px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; padding: 6px 13px; border: 0; background: none;
  color: var(--muted); cursor: pointer; border-radius: var(--r);
}
.tab:hover { background: rgba(15,20,25,.05); color: var(--ink); }
.tab.is-on { background: var(--ink); color: #fff; }

.page { padding: 26px 28px; max-width: 900px; margin: 0 auto; overflow-y: auto; height: calc(100% - 56px); }
.page h2 { font-family: var(--cond); font-size: 24px; margin: 0 0 4px; letter-spacing: .02em; }
.page .lede { color: var(--muted); margin: 0 0 22px; font-size: 14px; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px; margin-bottom: 18px; }
.setting { display: grid; grid-template-columns: 1fr 120px; gap: 12px 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.setting:last-of-type { border-bottom: 0; }
.setting .name { font-weight: 500; }
.setting .note { grid-column: 1 / -1; margin-top: -6px; color: var(--muted); font-size: 13px; }
.setting input {
  font-family: var(--mono); text-align: right; padding: 7px 10px;
  border: 1px solid var(--rule); border-radius: var(--r); width: 100%;
}
.setting input:invalid { border-color: var(--waiting); background: var(--waiting-wash); }

.locked { background: var(--paper); border-left: 3px solid var(--closed); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 13.5px; color: var(--muted); }
.locked b { color: var(--ink); }
.locked ul { margin: 8px 0 0; padding-left: 18px; }
.locked li { font-family: var(--mono); font-size: 12.5px; margin: 3px 0; }

.log { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.log th {
  font-family: var(--cond); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 0 12px 8px 0; border-bottom: 1px solid var(--rule); font-weight: 600;
}
.log td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.log td.when, .log td.who-col { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.log td.act { font-weight: 500; }
.log td.detail { color: var(--muted); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

/* Indikator kesegaran: papan yang membeku harus TERLIHAT membeku.
   Tanpa ini, jaringan putus terlihat persis seperti "tidak ada yang
   menunggu" — kegagalan paling berbahaya di panel triase. */
.stale { color: var(--waiting); }

.contact { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.contact .num { font-family: var(--mono); font-size: 13.5px; }
.contact .lbl { flex: 1; font-size: 14px; }
.contact .off { font-size: 12px; color: var(--muted); }
.contact-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 16px; }
.contact-add input { padding: 9px 11px; border: 1px solid var(--rule); border-radius: var(--r); }
.contact-add input:first-child { font-family: var(--mono); }
@media (max-width: 560px) { .contact-add { grid-template-columns: 1fr; } }

.hidden { display: none !important; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .queue { border-right: 0; }
  .thread { position: fixed; inset: 56px 0 0; z-index: 30; border-top: 1px solid var(--rule); }
  .bubble { max-width: 88%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">MARAWA<span>PST Padang Pariaman</span></div>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="conn_dot"></span><span id="conn_text">memeriksa…</span></div>
  <nav class="tabs hidden" id="tabs">
    <button class="tab is-on" data-tab="inbox">Kotak masuk</button>
    <button class="tab hidden" data-tab="settings" id="tab_settings">Setelan</button>
    <button class="tab hidden" data-tab="audit" id="tab_audit">Riwayat</button>
  </nav>
  <div class="who hidden" id="who"></div>
  <button class="btn ghost hidden" id="logout_btn">Keluar</button>
</div>

<div class="login-wrap" id="login_view">
  <form class="login" id="login_form">
    <h1>Masuk panel petugas</h1>
    <p>Gunakan nama pengguna dan kata sandi Anda.</p>
    <div class="field">
      <label for="admin_id">Nama pengguna</label>
      <input id="admin_id" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Kata sandi</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field hidden" id="totp_field">
      <label for="totp">Kode 6 angka (opsional)</label>
      <input id="totp" name="one-time-code" inputmode="numeric" maxlength="6"
             autocomplete="one-time-code" pattern="[0-9]{6}">
    </div>
    <button class="btn" type="submit" style="width:100%" id="login_btn">Masuk</button>
    <div class="alert hidden" id="login_err"></div>
  </form>
</div>

<div class="shell hidden" id="app_view">
  <aside class="queue" id="queue"></aside>
  <main class="thread hidden" id="thread"></main>
</div>

<div class="page hidden" id="settings_view"></div>
<div class="page hidden" id="audit_view"></div>

<div id="toast"></div>

<script>
'use strict';
const API = '';
let TOKEN = sessionStorage.getItem('marawa_token') || '';
let ME = null, ACTIVE = null, CONVOS = [], VERSION = 0;
let pollTimer = null, tickTimer = null;

const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function uuid() {
  return (crypto.randomUUID && crypto.randomUUID()) || 'r-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(method, url, body) {
  const res = await fetch(API + url, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { logout(); throw new Error('Sesi berakhir. Masuk kembali.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.message || 'Gagal (' + res.status + ')');
  return data;
}

async function apiBlob(url) {
  const res = await fetch(API + url, {
    headers: { 'Authorization': 'Bearer ' + TOKEN },
  });
  if (res.status === 401) { logout(); throw new Error('Sesi berakhir. Masuk kembali.'); }
  if (!res.ok) throw new Error('Gagal (' + res.status + ')');
  return res.blob();
}

/* Lama menunggu dihitung dari saat warga meminta petugas. Timer berdetak
   di sisi klien tiap detik supaya angkanya hidup, tanpa memaksa API
   di-polling per detik. */
function waitSeconds(iso) {
  if (!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
}
function fmtWait(s) {
  const m = Math.floor(s / 60);
  if (m >= 60) return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + '<small>JAM</small>';
  return m + ':' + String(s % 60).padStart(2, '0');
}
function urgency(s) { return s >= 900 ? 3 : s >= 300 ? 2 : 1; }
function since(c) { return c.handover_requested_at || c.last_activity_at || ''; }

function stateLabel(s) {
  return { BOT_ACTIVE: 'Dijawab bot', QUEUED: 'Menunggu petugas',
           ADMIN_ACTIVE: 'Ditangani petugas', IDLE_CLOSED: 'Selesai' }[s] || s;
}

function renderQueue() {
  const by = (s) => CONVOS.filter((c) => c.state === s);
  const waiting = by('QUEUED'), held = by('ADMIN_ACTIVE'), bot = by('BOT_ACTIVE'), closed = by('IDLE_CLOSED');

  let html = '<section class="group"><p class="eyebrow ' + (waiting.length ? 'is-waiting' : '') +
             '">Menunggu petugas <span class="count">' + waiting.length + '</span><hr></p>';

  if (!waiting.length) {
    html += '<div class="empty">Tidak ada yang menunggu. Bot sedang menangani <b>' + bot.length + '</b> percakapan.</div>';
  } else {
    for (const c of waiting) {
      const s = waitSeconds(since(c));
      html += '<button class="wait-card" data-urgency="' + urgency(s) + '" data-open="' + esc(c.conversation_id) + '">' +
        '<div class="wait-top"><span class="contact">' + esc(c.display_name || c.conversation_id) + '</span>' +
        '<span class="timer" data-since="' + esc(since(c)) + '">' + fmtWait(s) + '</span></div>' +
        '<div class="preview">' + esc(c.last_message || 'Meminta dibantu petugas.') + '</div></button>';
    }
  }
  html += '</section>';

  const quiet = (title, list, extra) => {
    if (!list.length) return '';
    let out = '<section class="group"><p class="eyebrow">' + title +
              ' <span class="count">' + list.length + '</span><hr></p>';
    for (const c of list) {
      out += '<button class="row s-' + esc(c.state) + (ACTIVE === c.conversation_id ? ' active' : '') +
             '" data-open="' + esc(c.conversation_id) + '"><span class="tick"></span>' +
             '<span class="id">' + esc(c.display_name || c.conversation_id) + '</span>' +
             '<span class="by">' + (extra ? esc(extra(c)) : '') + '</span></button>';
    }
    return out + '</section>';
  };

  html += quiet('Ditangani petugas', held, (c) => c.bot_paused_by || c.assigned_admin_id || '');
  html += quiet('Dijawab bot', bot);
  html += quiet('Selesai', closed);
  $('queue').innerHTML = html;
}

/* Timer berdetak tanpa menggambar ulang seluruh daftar — supaya fokus
   keyboard tidak hilang dan layar tidak berkedip saat petugas membaca. */
function tickTimers() {
  document.querySelectorAll('.timer[data-since]').forEach((el) => {
    const iso = el.getAttribute('data-since');
    if (!iso) return;
    const s = waitSeconds(iso);
    el.innerHTML = fmtWait(s);
    const card = el.closest('.wait-card');
    if (card) card.setAttribute('data-urgency', urgency(s));
  });
}

async function openThread(id) {
  ACTIVE = id;
  let data;
  try { data = await api('GET', '/conversations/' + encodeURIComponent(id)); }
  catch (e) { toast(e.message); return; }

  const conv = data.conversation || {}, msgs = data.messages || [];
  VERSION = conv.state_version;
  const held = conv.state === 'ADMIN_ACTIVE';
  const mine = !conv.bot_paused_by || conv.bot_paused_by === (ME && ME.admin_id);
  const canReply = held && mine;

  const bubbles = msgs.map((m) => {
    const out = m.direction === 'out';
    const who = m.sender_type === 'admin' ? (m.sender_admin_id || 'Petugas')
              : m.sender_type === 'bot' ? 'Bot' : 'Warga';
    const time = m.created_at
      ? new Date(m.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="bubble ' + (out ? 'out' : 'in') + (m.sender_type === 'bot' ? ' by-bot' : '') + '">' +
      '<div class="meta">' + esc(who) + (time ? ' · ' + esc(time) : '') + '</div>' +
      '<div class="body-text">' + esc(m.body) + '</div></div>';
  }).join('');

  $('thread').classList.remove('hidden');
  $('thread').innerHTML =
    '<div class="thread-head">' +
      '<button class="btn ghost" id="back_btn">Kembali</button>' +
      '<h2>' + esc(conv.display_name || conv.conversation_id || id) + '</h2>' +
      '<span class="pill ' + esc(conv.state) + '">' + esc(stateLabel(conv.state)) + '</span>' +
      (conv.bot_paused_by ? '<span class="who">dipegang <b>' + esc(conv.bot_paused_by) + '</b></span>' : '') +
      '<div class="spacer"></div>' +
      (held
        ? '<button class="btn ghost" id="act_btn" data-dir="off"' + (mine ? '' : ' disabled') + '>Kembalikan ke bot</button>'
        : '<button class="btn take" id="act_btn" data-dir="on">Ambil alih</button>') +
    '</div>' +
    '<div class="msgs" id="msgs">' + (bubbles || '<div class="empty">Belum ada pesan.</div>') + '</div>' +
    '<div class="composer">' +
      '<textarea id="reply" placeholder="' +
        (canReply ? 'Tulis balasan…' : 'Ambil alih dulu untuk membalas.') + '"' +
        (canReply ? '' : ' disabled') + '></textarea>' +
      '<div class="composer-foot"><span class="hint">' +
        (canReply ? 'Bot diam sampai Anda kembalikan.'
                  : held ? 'Percakapan ini sedang dipegang petugas lain.'
                         : 'Mengambil alih akan mendiamkan bot di percakapan ini.') +
      '</span><button class="btn" id="send_btn"' + (canReply ? '' : ' disabled') + '>Kirim</button></div>' +
    '</div>';

  $('back_btn').style.display = window.innerWidth <= 860 ? '' : 'none';
  const box = $('msgs'); if (box) box.scrollTop = box.scrollHeight;
  renderQueue();
}

function closeThread() { ACTIVE = null; $('thread').classList.add('hidden'); renderQueue(); }

async function toggleHandover(dir) {
  const btn = $('act_btn'); if (btn) btn.disabled = true;
  const id = ACTIVE;
  try {
    await api('POST', '/conversations/' + encodeURIComponent(id) + '/handover/' + dir,
              { expected_version: VERSION });
    toast(dir === 'on' ? 'Diambil alih' : 'Dikembalikan ke bot');
  } catch (e) {
    // 409 berarti petugas lain bergerak lebih dulu. Muat ulang keadaan
    // sebenarnya, jangan memaksa — dan katakan apa yang terjadi.
    toast(e.message);
  }
  await refresh();
  if (ACTIVE === id) await openThread(id);
}

async function sendReply() {
  const box = $('reply'), btn = $('send_btn');
  const body = box.value.trim();
  if (!body) return;
  btn.disabled = true; box.disabled = true;
  const id = ACTIVE;
  try {
    await api('POST', '/conversations/' + encodeURIComponent(id) + '/messages',
              { body: body, expected_version: VERSION, client_request_id: uuid() });
    box.value = '';
    toast('Terkirim');
    await openThread(id);
  } catch (e) {
    toast(e.message);
    btn.disabled = false; box.disabled = false;
  }
}

let LAST_OK = Date.now();

async function refresh() {
  let ok = true;
  try { CONVOS = await api('GET', '/conversations'); renderQueue(); }
  catch (e) { ok = false; }
  try {
    const st = await api('GET', '/status/whatsapp');
    const good = st.status === 'NORMAL';
    const bad = st.status === 'TERPUTUS' || st.status === 'BERMASALAH';
    $('conn_dot').className = 'dot ' + (good ? 'ok' : bad ? 'bad' : '');
    $('conn_text').textContent = 'WhatsApp ' + String(st.status || '—').toLowerCase() +
      (st.bot_globally_enabled === false ? ' · bot dimatikan' : '');
  } catch (e) { ok = false; }
  if (ok) LAST_OK = Date.now();
  showFreshness();
}

/* Papan triase yang membeku HARUS terlihat membeku. Kalau tidak, jaringan
   putus terlihat persis sama dengan "tidak ada yang menunggu" — dan itu
   kegagalan paling berbahaya di antarmuka ini. Polling dipertahankan
   (bukan SSE) justru karena polling pulih sendiri; aliran SSE yang mati
   diam-diam meninggalkan papan basi tanpa gejala apa pun. */
function showFreshness() {
  const age = Math.floor((Date.now() - LAST_OK) / 1000);
  const el = $('conn_text');
  if (age > 20) {
    el.textContent = 'Data ' + age + ' detik lalu — periksa koneksi';
    el.classList.add('stale');
    $('conn_dot').className = 'dot bad';
  } else {
    el.classList.remove('stale');
  }
}

/* ── Tab ── */
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('is-on', t.dataset.tab === name));
  $('app_view').classList.toggle('hidden', name !== 'inbox');
  $('settings_view').classList.toggle('hidden', name !== 'settings');
  $('audit_view').classList.toggle('hidden', name !== 'audit');
  if (name === 'settings') loadSettings();
  if (name === 'audit') loadAudit();
}

/* ── Setelan ── */
const SETTING_META = {
  citizen_idle_minutes:        ['Sesi warga berakhir setelah', 2, 30, 'Percakapan yang dijawab bot ditutup setelah sekian menit tanpa pesan.'],
  queue_expiry_minutes:        ['Antrean kedaluwarsa setelah', 30, 1440, 'Warga yang meminta petugas tetap menunggu selama ini sebelum dianggap batal. Sengaja jauh lebih panjang daripada sesi biasa — mereka menunggu kita, bukan sedang diam.'],
  handover_auto_revert_minutes:['Bot kembali otomatis setelah', 5, 480, 'Kalau petugas mengambil alih lalu lupa mengembalikan, bot menyala lagi supaya warga tidak terlantar.'],
  queue_notify_repeat_minutes: ['Ulangi notifikasi tiap', 1, 30, 'Jeda minimum antar pemberitahuan untuk satu percakapan yang sama.'],
};

async function loadSettings() {
  const v = $('settings_view');
  v.innerHTML = '<h2>Setelan</h2><p class="lede">Memuat…</p>';
  try {
    const [timeouts, agent] = await Promise.all([
      api('GET', '/settings/timeouts'),
      api('GET', '/settings/agent'),
    ]);
    let rows = '';
    for (const [key, meta] of Object.entries(SETTING_META)) {
      const [label, lo, hi, note] = meta;
      const val = timeouts[key];
      if (val === undefined) continue;
      rows += '<div class="setting"><span class="name">' + esc(label) + '</span>' +
        '<input type="number" min="' + lo + '" max="' + hi + '" value="' + esc(String(val)) +
        '" data-key="' + esc(key) + '">' +
        '<span class="note">' + esc(note) + ' Rentang ' + lo + '–' + hi + ' menit.</span></div>';
    }
    v.innerHTML =
      '<h2>Setelan</h2>' +
      '<p class="lede">Nilai di luar rentang ditolak server, bukan hanya formulir.</p>' +
      '<div class="panel"><h3 style="margin:0 0 4px;font-family:var(--cond);letter-spacing:.04em">WhatsApp</h3>' +
        '<p class="lede" style="margin-bottom:10px" id="wa_status">Memeriksa koneksi…</p>' +
        '<img id="wa_qr" alt="QR pairing" style="display:none;width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--rule);border-radius:8px;background:#fff">' +
        '<div style="margin-top:10px"><button class="btn ghost" id="wa_refresh">Muat ulang QR</button></div>' +
      '</div>' +
      '<div class="panel">' + rows +
        '<div style="margin-top:16px;display:flex;gap:10px;align-items:center">' +
        '<button class="btn" id="save_settings">Simpan perubahan</button>' +
        '<span class="hint" id="settings_hint"></span></div>' +
      '</div>' +
      '<div class="panel"><h3 style="margin:0 0 4px;font-family:var(--cond);letter-spacing:.04em">Nomor petugas</h3>' +
        '<p class="lede" style="margin-bottom:14px">Bot mengirim pemberitahuan ke nomor-nomor ini saat ada warga menunggu. ' +
        'Nomor yang terdaftar di sini tidak dilayani bot — balasan Anda ke pemberitahuan tidak akan dijawab.</p>' +
        '<div id="contacts_list"></div>' +
        '<div class="contact-add">' +
          '<input id="ct_phone" placeholder="08123456789" inputmode="tel">' +
          '<input id="ct_label" placeholder="Nama petugas">' +
          '<button class="btn" id="add_contact">Tambah</button>' +
        '</div>' +
      '</div>' +
      '<div class="panel"><h3 style="margin:0 0 10px;font-family:var(--cond);letter-spacing:.04em">Agent</h3>' +
        '<p class="lede" style="margin-bottom:14px">' + esc(agent.note || '') + '</p>' +
        '<div class="locked"><b>Tidak dapat diubah dari sini, selamanya.</b>' +
        '<ul>' + (agent.never_editable || []).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
        'Pemeriksaan kebenaran jawaban hidup di kode dan hanya berubah lewat rilis. ' +
        'Tombol yang bisa mematikannya, cepat atau lambat, akan ditekan saat bot terasa kurang membantu.' +
        '</div></div>';
    loadWhatsApp();
    loadContacts();
  } catch (e) {
    v.innerHTML = '<h2>Setelan</h2><div class="alert">' + esc(e.message) + '</div>';
  }
}

async function loadWhatsApp() {
  const statusEl = $('wa_status'), img = $('wa_qr');
  const refreshBtn = $('wa_refresh');
  if (!statusEl) return;
  if (refreshBtn) refreshBtn.onclick = loadWhatsApp;
  try {
    const s = await api('GET', '/settings/whatsapp');
    if (s.connected) {
      statusEl.textContent = 'Terhubung ke WhatsApp. Bot siap melayani warga.';
      statusEl.style.color = 'var(--bot)';
      if (img) img.style.display = 'none';
      return;
    }
    statusEl.textContent = 'Belum terhubung. Pindai QR dengan WhatsApp yang dipakai bot:';
    statusEl.style.color = 'var(--waiting)';
    if (img && s.qr) {
      const png = await apiBlob('/settings/whatsapp-qr.png');
      img.src = URL.createObjectURL(png);
      img.style.display = 'block';
    }
  } catch (e) {
    statusEl.textContent = 'Tidak dapat memeriksa koneksi: ' + esc(e.message);
    statusEl.style.color = 'var(--waiting)';
  }
}

async function loadContacts() {
  const box = $('contacts_list');
  if (!box) return;
  try {
    const rows = await api('GET', '/settings/admin-contacts');
    box.innerHTML = rows.length
      ? rows.map((c) =>
          '<div class="contact"><span class="num">' + esc(c.display || c.phone_e164) + '</span>' +
          '<span class="lbl">' + esc(c.label) + '</span>' +
          (c.notify ? '' : '<span class="off">notifikasi mati</span>') +
          '<button class="btn ghost" data-del="' + esc(String(c.contact_id)) + '">Hapus</button></div>'
        ).join('')
      : '<div class="empty">Belum ada nomor. Tanpa ini, pemberitahuan tidak sampai ke siapa pun ' +
        'dan petugas hanya tahu ada yang menunggu bila kebetulan membuka panel.</div>';
  } catch (e) {
    box.innerHTML = '<div class="alert">' + esc(e.message) + '</div>';
  }
}

async function addContact() {
  const phone = $('ct_phone').value.trim(), label = $('ct_label').value.trim();
  if (!phone || !label) { toast('Isi nomor dan namanya'); return; }
  try {
    const res = await api('POST', '/settings/admin-contacts', { phone: phone, label: label });
    $('ct_phone').value = ''; $('ct_label').value = '';
    toast('Ditambahkan: ' + res.display);
    await loadContacts();
  } catch (e) { toast(e.message); }
}

async function removeContact(id) {
  try {
    await api('DELETE', '/settings/admin-contacts/' + encodeURIComponent(id));
    toast('Nomor dihapus');
    await loadContacts();
  } catch (e) { toast(e.message); }
}

async function saveSettings() {
  const values = {};
  let bad = null;
  document.querySelectorAll('#settings_view input[data-key]').forEach((el) => {
    const n = Number(el.value);
    if (!Number.isInteger(n) || n < Number(el.min) || n > Number(el.max)) bad = el;
    values[el.dataset.key] = n;
  });
  if (bad) { bad.focus(); toast('Ada nilai di luar rentang'); return; }
  try {
    await api('PUT', '/settings/timeouts', { values: values });
    toast('Setelan disimpan');
  } catch (e) { toast(e.message); }
}

/* ── Riwayat (audit log) ── */
async function loadAudit() {
  const v = $('audit_view');
  v.innerHTML = '<h2>Riwayat</h2><p class="lede">Memuat…</p>';
  try {
    const rows = await api('GET', '/audit-log');
    const body = (rows || []).map((r) => {
      const when = r.at ? new Date(r.at).toLocaleString('id-ID',
        { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      let detail = '';
      try { detail = r.detail && Object.keys(r.detail).length ? JSON.stringify(r.detail) : ''; }
      catch (err) { detail = ''; }
      return '<tr><td class="when">' + esc(when) + '</td>' +
        '<td class="act">' + esc(r.action) + '</td>' +
        '<td class="who-col">' + esc(r.admin_id || '—') + '</td>' +
        '<td class="who-col">' + esc(r.conversation_id || '—') + '</td>' +
        '<td class="detail">' + esc(detail) + '</td></tr>';
    }).join('');
    v.innerHTML =
      '<h2>Riwayat</h2>' +
      '<p class="lede">Catatan permanen. Tidak dapat dihapus atau diubah oleh siapa pun, ' +
      'termasuk superadmin — catatan yang bisa disunting tidak menjawab apa pun.</p>' +
      '<div class="panel">' +
      (body
        ? '<table class="log"><thead><tr><th>Waktu</th><th>Tindakan</th><th>Petugas</th>' +
          '<th>Percakapan</th><th>Rincian</th></tr></thead><tbody>' + body + '</tbody></table>'
        : '<div class="empty">Belum ada tindakan tercatat.</div>') +
      '</div>';
  } catch (e) {
    v.innerHTML = '<h2>Riwayat</h2><div class="alert">' + esc(e.message) + '</div>';
  }
}

async function boot() {
  try { ME = await api('GET', '/admin/session'); }
  catch (e) { return showLogin(); }
  $('login_view').classList.add('hidden');
  $('app_view').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('logout_btn').classList.remove('hidden');
  $('who').innerHTML = '<b>' + esc(ME.admin_id) + '</b> · ' + esc(ME.role);
  $('tabs').classList.remove('hidden');
  if (ME.role === 'superadmin') {
    $('tab_settings').classList.remove('hidden');
    $('tab_audit').classList.remove('hidden');
  }
  showTab('inbox');
  await refresh();
  clearInterval(pollTimer); clearInterval(tickTimer);
  pollTimer = setInterval(refresh, 5000);
  tickTimer = setInterval(tickTimers, 1000);
}

function showLogin() {
  $('login_view').classList.remove('hidden');
  $('app_view').classList.add('hidden');
  $('who').classList.add('hidden');
  $('logout_btn').classList.add('hidden');
  $('admin_id').focus();
}

function logout() {
  TOKEN = ''; ME = null; ACTIVE = null; CONVOS = [];
  sessionStorage.removeItem('marawa_token');
  clearInterval(pollTimer); clearInterval(tickTimer);
  $('thread').classList.add('hidden');
  $('tabs').classList.add('hidden');
  $('tab_settings').classList.add('hidden');
  $('tab_audit').classList.add('hidden');
  $('settings_view').classList.add('hidden');
  $('audit_view').classList.add('hidden');
  showLogin();
}

/* Delegasi event: daftar digambar ulang tiap 5 detik, jadi handler
   inline akan hilang bersama simpulnya. */
document.addEventListener('click', (ev) => {
  const open = ev.target.closest('[data-open]');
  if (open) { openThread(open.getAttribute('data-open')); return; }
  if (ev.target.closest('#back_btn')) { closeThread(); return; }
  const act = ev.target.closest('#act_btn');
  if (act) { toggleHandover(act.getAttribute('data-dir')); return; }
  if (ev.target.closest('#send_btn')) { sendReply(); return; }
  const tab = ev.target.closest('.tab');
  if (tab) { showTab(tab.dataset.tab); return; }
  if (ev.target.closest('#save_settings')) { saveSettings(); return; }
  if (ev.target.closest('#add_contact')) { addContact(); return; }
  const del = ev.target.closest('[data-del]');
  if (del) { removeContact(del.getAttribute('data-del')); return; }
  if (ev.target.closest('#logout_btn')) { logout(); }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && ACTIVE) closeThread();
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ACTIVE && $('reply') && !$('reply').disabled) {
    sendReply();
  }
});

$('login_form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = $('login_err'), btn = $('login_btn');
  err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Memeriksa…';
  try {
    const res = await fetch(API + '/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        admin_id: $('admin_id').value.trim(),
        password: $('password').value,
        totp_code: $('totp').value.trim() || null,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 429 membawa Retry-After; sampaikan apa adanya agar petugas tahu
      // harus menunggu, bukan mengira kodenya yang salah terus.
      throw new Error(data.detail || 'Kode tidak diterima. Coba kode berikutnya.');
    }
    TOKEN = data.token;
    sessionStorage.setItem('marawa_token', TOKEN);
    $('totp').value = '';
    await boot();
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
    $('totp').value = ''; $('totp').focus();
  } finally {
    btn.disabled = false; btn.textContent = 'Masuk';
  }
});

if (TOKEN) boot(); else showLogin();
</script>
